<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>KLYK Studio Forms</title>
  </head>
  <body>
    <form name="quick-audit-intake" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="hidden" name="form-name" value="quick-audit-intake" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="objective" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <textarea name="notes"></textarea>
      <input type="text" name="calendly_event_uri" />
      <input type="text" name="calendly_invitee_uri" />
    </form>

    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
